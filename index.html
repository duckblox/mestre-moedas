<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- 📱 viewport: faz a página caber na tela do celular. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mestre das Moedas</title>

    <!-- 🎨 CSS: define cores, tamanhos e animações. Cada regra: seletor { propriedade: valor; } -->
    <style>
      [hidden] {
        display: none !important;
      }
      /* 🎨 Variáveis de cor: mude --bg e --ac e veja o jogo todo mudar! */
      :root {
        --bg: #1a1446;
        --card: #2b2370;
        --ink: #fff;
        --mut: #c9c4ff;
        --ac: #2ee6b8;
        --gold: #ffd23f;
        --red: #ff6b8b;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d0a2e;
          --card: #1c1655;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d0a2e;
        --card: #1c1655;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font:
          22px/1.35 system-ui,
          sans-serif;
        text-align: center;
      }
      /* 📊 Barra de cima (grid = tabela flexível de 3 colunas) */

      #top {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
        padding: 10px;
        background: var(--card);
        font-size: 18px;
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
      }
      #top b {
        font-size: 24px;
        color: var(--gold);
      }
      #bar {
        height: 8px;
        background: #0006;
        grid-column: 1/-1;
        border-radius: 6px;
        overflow: hidden;
      }
      #bar i {
        display: block;
        height: 100%;
        background: var(--ac);
      }
      #v {
        max-width: 560px;
        margin: 0 auto;
        padding: 14px 14px 130px;
      }
      /* 🃏 .card = a "caixa arredondada" usada em todo o jogo */

      .card {
        background: var(--card);
        border-radius: 22px;
        padding: 18px;
        margin-bottom: 14px;
      }
      .huge {
        font-size: 56px;
        margin: 8px 0;
      }
      h2 {
        margin: 4px 0;
        font-size: 26px;
      }
      /* 🔘 .b = botão grande do jogo (.b.g dourado, .b.x vermelho) */

      .b {
        font: inherit;
        font-weight: 700;
        font-size: 24px;
        border: 0;
        border-radius: 18px;
        padding: 16px;
        background: var(--ac);
        color: #08203a;
        width: 100%;
        margin-top: 12px;
        cursor: pointer;
      }
      .b.g {
        background: var(--gold);
      }
      .b.ok {
        background: #3ddc84;
      }
      .b.x {
        background: var(--red);
      }
      .b:disabled {
        opacity: 0.4;
      }
      .s {
        font: inherit;
        background: none;
        border: 2px solid var(--mut);
        color: var(--ink);
        border-radius: 14px;
        padding: 8px 14px;
        margin-bottom: 12px;
      }
      small {
        display: block;
        font-size: 17px;
        color: var(--mut);
        font-weight: 400;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      /* 🧭 Menu de baixo, fixo na tela (position: fixed) */

      #n {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: space-around;
        background: var(--card);
        padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
        z-index: 5;
      }
      #n button {
        font: inherit;
        font-size: 12px;
        background: none;
        border: 0;
        color: var(--mut);
        padding: 6px 4px;
        border-radius: 12px;
      }
      #n button span {
        display: block;
        font-size: 26px;
      }
      #n button.on {
        background: #ffffff22;
        color: #fff;
      }
      /* 🪟 Janela de aviso por cima de tudo (z-index alto) */

      #m {
        position: fixed;
        inset: 0;
        background: #000b;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 20;
      }
      #m .card {
        background: #3a2f9a;
        max-width: 480px;
        width: 100%;
      }
      .ln {
        display: flex;
        justify-content: space-between;
        font-size: 24px;
        padding: 4px 0;
      }
      #t {
        position: fixed;
        left: 50%;
        top: 90px;
        transform: translate(-50%, -20px);
        background: var(--gold);
        color: #222;
        border-radius: 16px;
        padding: 12px 18px;
        opacity: 0;
        transition: 0.3s;
        z-index: 30;
        max-width: 90%;
        font-weight: 700;
        pointer-events: none;
      }
      #t.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .f {
        position: fixed;
        top: -40px;
        font-size: 34px;
        pointer-events: none;
        z-index: 40;
        animation: f 2s linear forwards;
      }
      @keyframes f {
        to {
          transform: translateY(110vh) rotate(300deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .f {
          display: none;
        }
      }
      /* 🎞️ Cenas animadas dos trabalhos (animation + @keyframes) */

      .sc {
        position: relative;
        height: 150px;
        border-radius: 18px;
        overflow: hidden;
        font-size: 50px;
        margin-bottom: 10px;
      }
      .sc i {
        position: absolute;
        font-style: normal;
      }
      .g {
        background: #256d2c;
      }
      .g .cut {
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        background: #7be07b;
        animation: w 4s linear forwards;
      }
      .g .ac {
        left: 0;
        top: 45px;
        animation: mv 4s linear forwards;
      }
      .c {
        background: linear-gradient(#5aa9e6, #cfeaff);
      }
      .c .car {
        left: 50%;
        top: 40px;
        margin-left: -35px;
        font-size: 70px;
        filter: grayscale(1) brightness(0.5);
        animation: cl 4s forwards;
      }
      .c .sp {
        left: 50%;
        top: 60px;
        animation: sh 0.35s infinite alternate;
      }
      .r {
        background: #2b2f3a;
      }
      .r .st {
        left: 0;
        right: 0;
        top: 72px;
        height: 6px;
        background: repeating-linear-gradient(90deg, #ffd23f 0 40px, transparent 40px 80px);
        animation: rd 4s linear forwards;
      }
      .r .ac {
        left: 12%;
        top: 45px;
      }
      .r .pin {
        top: 45px;
        animation: pin 4s linear forwards;
      }
      @keyframes mv {
        to {
          left: 85%;
        }
      }
      @keyframes w {
        to {
          width: 92%;
        }
      }
      @keyframes cl {
        to {
          filter: none;
        }
      }
      @keyframes sh {
        from {
          transform: translateX(-35px) rotate(-15deg);
        }
        to {
          transform: translateX(35px) rotate(15deg);
        }
      }
      @keyframes rd {
        to {
          background-position-x: -900px;
        }
      }
      @keyframes pin {
        from {
          left: 92%;
        }
        to {
          left: 32%;
        }
      }
      #n button {
        flex: 1;
        min-width: 0;
      }
      #m {
        overflow: auto;
      }
      #m .card {
        max-height: 88vh;
        overflow: auto;
      }
      button {
        touch-action: manipulation;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      /* 📢 Propaganda simulada */

      #ad {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: calc(96px + env(safe-area-inset-bottom, 0px));
        max-width: 540px;
        margin: 0 auto;
        background: linear-gradient(135deg, #ff7a18, #af002d);
        border-radius: 20px;
        padding: 12px 14px;
        z-index: 7;
        text-align: left;
        font-size: 19px;
        box-shadow: 0 4px 18px #0008;
      }
      #ad small {
        color: #fff;
        opacity: 0.95;
      }
      #ad .two {
        margin-top: 8px;
      }
      #ad button {
        font: inherit;
        font-size: 18px;
        font-weight: 700;
        border: 0;
        border-radius: 14px;
        padding: 10px;
        background: #fff;
        color: #7a1030;
      }
      #ad.ok {
        background: linear-gradient(135deg, #0f9b6e, #2563eb);
      }
      #ad .tg {
        font-size: 13px;
        letter-spacing: 1px;
      }
      .calm .f {
        display: none;
      }
      @keyframes kb {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-34px);
        }
      }
      @keyframes kr {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes kz {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.4);
        }
      }
    </style>
  </head>
  <body>
    <!-- 🧱 HTML: a estrutura é só um conjunto de "caixas" (div). O JavaScript preenche cada uma. -->
    <div id="top"></div>
    <!-- barra de cima: carteira, cofre, relógio e nível -->
    <div id="av"></div>
    <!-- avatar e barras de energia, fome, saúde e lazer -->
    <div id="v"></div>
    <!-- a TELA atual (casa, trabalho, cofre, loja...) -->
    <div id="n"></div>
    <!-- menu de baixo, com as abas -->
    <div id="m" hidden></div>
    <!-- janela de aviso (hidden = escondida) -->
    <div id="ad" hidden></div>
    <!-- propaganda simulada -->
    <div id="t"></div>
    <!-- mensagem rápida (toast) -->
    <!-- 🧠 JAVASCRIPT: a lógica do jogo. Leia o GUIA logo abaixo. -->
    <script>
      /* =====================================================================
   🗺️ GUIA DO CÓDIGO (leia primeiro!)
   Este jogo é UM arquivo HTML com 3 partes:
     1) <style>  → a aparência (cores, tamanhos). CSS.
     2) <body>   → quase vazio: só "caixas" (div) que o JavaScript preenche.
     3) <script> → o cérebro do jogo. JavaScript. Você está aqui!

   COMO O JOGO FUNCIONA (o "ciclo"):
     • G guarda TUDO o que muda: dinheiro (G.c), cofre (G.b), dia (G.d)...
     • Você clica num botão → uma função muda G → render() redesenha a tela.
     • save() guarda G no navegador, e o progresso não se perde.

   🛠️ MODO CRIADOR: procure os blocos marcados com "MUDE AQUI" (preços,
   ganhos, emojis). Troque um número, salve e recarregue a página.
   Ex.: no sorvete, mude v:8 para v:1. O que acontece?
   ===================================================================== */

      /* 📚 CONCEITOS PARA APRENDER (e onde achar neste arquivo)
   • Variáveis e constantes (const, let) ........ logo abaixo, em NEW e G
   • Listas (arrays) e objetos ................... JOBS, FARM, LOJA (PARTE 3)
   • Funções ..................................... PARTE 4 (dormir, start, ans)
   • Condições (if / ?:) e repetições (for, forEach, map) .. dormir()
   • Texto com ${variável} (template literal) .... PARTE 5, as telas
   • Eventos (clique) e temporizador (setInterval) .. PARTE 7
   • Guardar dados no navegador (localStorage) ... save()
   • CANVAS (desenhar com código) ................ desenhaGrafico(), PARTE 6
   • Sons com código (Web Audio) ................. bip(), PARTE 2           */
      /* ==================================================================
   PARTE 1 — FERRAMENTAS E ESTADO DO JOGO
   ================================================================== */
      /* 🔧 Ferramentas pequenas: $ acha um elemento da página; R sorteia um número entre 0 e 1; ri sorteia um número inteiro; brl escreve dinheiro assim: R$ 10,50. */
      const $ = (id) => document.getElementById(id),
        R = Math.random,
        ri = (a, b) => a + Math.floor(R() * (b - a + 1)),
        r2 = (n) => Math.round(n * 100) / 100,
        brl = (n) => "R$ " + r2(n).toFixed(2).replace(".", ",").replace(",00", "");
      /* 💰 RATE é o juro do cofre: .03 = 3% POR DIA (no mundo real é bem menor! aqui é acelerado para você ver o efeito). NEW é o estado inicial do jogo (R$ 20 na carteira). calm = modo calmo, dif = dificuldade das contas (1 fácil, 2 médio, 3 difícil), ads = propagandas simuladas. */
      const RATE = 0.03,
        NEW = {
          c: 20,
          b: 0,
          d: 1,
          xp: 0,
          ok: 0,
          pc: 0,
          pg: [],
          proj: {},
          inv: {},
          pr: {},
          rq: null,
          en: 100,
          div: 0,
          doente: 0,
          vc: 0,
          lt: 0,
          bk: 0,
          sg: 0,
          lz: 80,
          ads: 0,
          at: {},
          calm: 1,
          dif: 2,
          vi: 0,
          h: 7,
          ch: 0,
          ov: 0,
          fz: {},
        };
      /* 💾 G começa como uma cópia de NEW; depois, se houver jogo salvo no navegador (localStorage), os dados salvos substituem os iniciais. */
      let G = structuredClone(NEW);
      try {
        Object.assign(G, JSON.parse(localStorage.getItem("cofre2") || "{}"));
      } catch (e) {}
      const save = () => {
        try {
          localStorage.setItem("cofre2", JSON.stringify(G));
        } catch (e) {}
      };
      /* ==================================================================
   PARTE 2 — SOM (Web Audio: o navegador cria sons com código)
   ================================================================== */
      let ac,
        som = 1,
        pz = 0;
      function bip(a, b, d, w = 0) {
        if (!som) return;
        try {
          ac = ac || new (window.AudioContext || window.webkitAudioContext)();
          const o = ac.createOscillator(),
            g = ac.createGain(),
            t = ac.currentTime + w;
          o.type = "triangle";
          o.frequency.setValueAtTime(a, t);
          o.frequency.exponentialRampToValueAtTime(b, t + d);
          g.gain.setValueAtTime(0.12, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + d);
          o.connect(g);
          g.connect(ac.destination);
          o.start(t);
          o.stop(t + d);
        } catch (e) {}
      }
      const SFX = {
        ad: () => {
          bip(700, 900, 0.1);
          bip(900, 1200, 0.15, 0.12);
        },
        coin: () => bip(880, 1320, 0.15),
        pay: () => bip(400, 200, 0.15),
        pop: () => bip(600, 950, 0.08),
        bad: () => bip(260, 110, 0.35),
        up: () => {
          bip(523, 659, 0.12);
          bip(659, 784, 0.12, 0.12);
          bip(784, 1047, 0.3, 0.24);
        },
        bell: () => {
          bip(988, 988, 0.25);
          bip(1319, 1319, 0.35, 0.25);
        },
        sleep: () => {
          bip(520, 260, 0.5);
          bip(400, 200, 0.6, 0.4);
        },
        egg: () => {
          bip(700, 500, 0.08);
          bip(900, 600, 0.1, 0.1);
        },
      };
      const sfx = (k) => SFX[k] && SFX[k]();
      /* ==================================================================
   PARTE 3 — DADOS DO JOGO (listas que você pode editar)
   ================================================================== */
      /* ⭐ MUDE AQUI: NIV = XP necessário para cada nível. TIT = nome de cada nível. */
      const NIV = [0, 35, 90, 170, 280, 420, 600, 820, 1100],
        TIT = [
          "🌱 Aprendiz",
          "🚗 Autônomo",
          "🎬 Criador",
          "✍️ Blogueiro",
          "🌐 Dono de site",
          "📱 Programador",
          "📚 Autor",
          "🏭 Investidor",
          "👑 Mestre das Finanças",
        ];
      const lv = () => NIV.filter((x) => G.xp >= x).length;
      /* 💼 MUDE AQUI: trabalhos. e = emoji, n = nome, l = nível para liberar, v = quanto paga. */
      /* 🎲 pk(lista) escolhe 1 item ao acaso; mx(lista) embaralha uma cópia. Cada serviço com g:() cria seu próprio desafio: {t: pergunta, r: resposta certa, o: opções}. Quer um serviço novo? Copie uma linha e invente o desafio! */
      const pk = (a) => a[ri(0, a.length - 1)],
        mx = (a) => [...a].sort(() => R() - 0.5);
      const JOBS = [
        { e: "✂️", n: "Cortar grama", l: 1, v: 8, s: "contas" },
        { e: "🧼", n: "Lavar carro", l: 1, v: 12, s: "contas", b: "agua" },
        {
          e: "🐕",
          n: "Passear com o cachorro",
          l: 1,
          v: 10,
          s: "distância",
          g: () => {
            const a = ri(2, 9),
              b = ri(2, 9),
              r = a + b;
            return {
              t: `🐕 Ida: ${a} km. Volta: ${b} km. Total de km?`,
              r,
              o: [r, r + ri(1, 3), Math.max(0, r - ri(1, 3))],
            };
          },
        },
        { e: "🚖", n: "Corrida de app", l: 2, v: 20, s: "contas", b: "net" },
        {
          e: "🍋",
          n: "Vender limonada",
          l: 2,
          v: 14,
          s: "lucro",
          b: "agua",
          g: () => {
            const c = ri(2, 8),
              p = ri(2, 5),
              k = ri(2, Math.min(9, c * p)),
              r = c * p - k;
            return {
              t: `🍋 Vendeu ${c} copos a R$ ${p} e gastou R$ ${k} nos limões. Qual o lucro?`,
              r,
              o: [r, r + ri(1, 3), Math.max(0, r - ri(1, 3))],
            };
          },
        },
        {
          e: "📰",
          n: "Entregar encomendas",
          l: 2,
          v: 16,
          s: "sequência",
          g: () => {
            const a = ri(1, 5),
              d = ri(2, 5),
              r = a + 3 * d;
            return { t: `📦 Casas: ${a}, ${a + d}, ${a + 2 * d}, ?`, r, o: [r, r + d, r - 1] };
          },
        },
        {
          e: "🧮",
          n: "Completar a tabuada",
          l: 2,
          v: 32,
          s: "tabuada",
          g: () => {
            const n = ri(2, [5, 8, 10][G.dif - 1] || 8),
              m = ri(2, 5),
              r = n * (m + 1),
              a = [];
            for (let i = 1; i <= m; i++) a.push(n * i);
            return {
              t: `🧮 Tabuada do ${n}: ${a.join(", ")}, ?`,
              r,
              h: `Vá somando ${n} ao último número`,
              o: [r, r + n, Math.max(1, r - n)],
            };
          },
        },
        {
          e: "🛒",
          n: "Caixa de mercadinho",
          l: 3,
          v: 25,
          s: "troco",
          b: "luz",
          g: () => {
            const m = pk([10, 20]),
              p = ri(2, m - 1),
              r = m - p;
            return {
              t: `🛒 A compra deu R$ ${p}. O cliente pagou R$ ${m}. Qual o troco?`,
              r,
              o: [r, r + ri(1, 3), Math.max(0, r - ri(1, 3))],
            };
          },
        },
        {
          e: "🪴",
          n: "Cuidar de plantas",
          l: 3,
          v: 22,
          s: "calendário",
          b: "agua",
          g: () => {
            const d = ri(1, 10),
              k = ri(2, 4),
              r = d + k;
            return {
              t: `🪴 Regar a cada ${k} dias. Hoje é o dia ${d}. Quando regar de novo?`,
              r,
              o: [r, r + 1, r - 1],
            };
          },
        },
        {
          e: "🚲",
          n: "Consertar bicicletas",
          l: 4,
          v: 30,
          s: "ordem",
          g: () => {
            const p = mx(["🔩", "⚙️", "🛞", "🔧", "⛓️"]);
            return {
              t: `🚲 Monte na ordem certa: ${p[0]}${p[1]}${p[0]}${p[1]}${p[0]} ?`,
              r: p[1],
              o: [p[1], p[0], p[2]],
            };
          },
        },
        {
          e: "📸",
          n: "Fotografar eventos",
          l: 4,
          v: 28,
          s: "padrões",
          g: () => {
            const c = mx(["🔴", "🟢", "🔵", "🟡", "🟣"]);
            return {
              t: `📸 Qual cor completa? ${c[0]}${c[1]}${c[2]}${c[0]}${c[1]}?`,
              r: c[2],
              o: [c[0], c[1], c[2]],
            };
          },
        },
        {
          e: "🎮",
          n: "Testar jogos (achar bugs)",
          l: 5,
          v: 40,
          s: "atenção",
          b: "net",
          g: () => {
            const k = ri(1, 5),
              a = [];
            for (let i = 0; i < 12; i++) a.push(i < k ? "🐞" : "🟩");
            return {
              t: `🎮 Quantos bugs 🐞 há? ${mx(a).join("")}`,
              r: k,
              o: [k, k + 1, Math.max(0, k - 1)],
            };
          },
        },
        {
          e: "🎨",
          n: "Desenhar skins",
          l: 5,
          v: 45,
          s: "cores",
          b: "luz",
          g: () => {
            const t = pk([
                ["🔴", "🔵", "🟣"],
                ["🔵", "🟡", "🟢"],
                ["🔴", "🟡", "🟠"],
              ]),
              o = mx(["🟣", "🟢", "🟠", "🟤"]).filter((x) => x != t[2]);

                const x = G.fz[f.id];
                if (lv() < f.l)
                  return `<div class=card><div class=huge>🔒</div>Nível ${f.l}: ${f.e} ${f.n}</div>`;
                const rd = x && x.r <= G.d && !cut("agua");
                return `<div class=card><div class=huge>${x && !rd ? "🌱" : f.e}</div><b>${f.n}</b><small>${rd ? "Pronta para colher!" : x ? "Crescendo... pronta no dia " + x.r : "Custa " + brl(f.c) + (f.tree ? " · dá fruta de novo e de novo" : " · colhe e vende " + brl(f.v))}</small><button class="b ${rd ? "g" : ""}" ${(x && !rd) || (!x && G.c + G.b < f.c) ? "disabled" : ""} data-c="${rd ? `colher('${f.id}')` : `plantar('${f.id}')`}">${rd ? "Colher " + brl(f.v) : x ? "⏳ Esperando" : "Plantar"}</button></div>`;
              })
              .join("") +
            (lv() < 2
              ? `<div class=card><div class=huge>🔒</div>Nível 2: 🐔 Galinhas</div>`
              : `<div class=card><div class=huge>🐔 ×${G.ch}</div><small>Galinha ${brl(30)} · ração ${brl(1)} por galinha por dia · ovo ${brl(4)} · máximo 5</small><div>🥚 ${G.ov} ovos</div><button class=b ${G.ch >= 5 || G.c + G.b < 30 ? "disabled" : ""} data-c="galinha()">Comprar galinha</button><button class="b g" ${G.ov ? "" : "disabled"} data-c="ovos()">Vender ovos ${brl(G.ov * 4)}</button></div>`) +
            (lv() < 5
              ? `<div class=card><div class=huge>🔒</div>Nível 5: 🐄 Vacas</div>`
              : `<div class=card><div class=huge>🐄 ×${G.vc}</div><small>Vaca ${brl(150)} · ração ${brl(3)} por vaca por dia · leite ${brl(12)} · máximo 3</small><div>🥛 ${G.lt} leites</div><button class=b ${G.vc >= 3 || G.c + G.b < 150 ? "disabled" : ""} data-c="vaca()">Comprar vaca</button><button class="b g" ${G.lt ? "" : "disabled"} data-c="leite()">Vender leite ${brl(G.lt * 12)}</button></div>`)
          );
        },
        job() {
          if (Q) {
            if (Q.ph == 0)
              return `<div class=card>${SC[Q.si]}<h2>⏳ ${Q.req ? "Atendendo o pedido..." : "Trabalhando..."}</h2></div>`;
            const q = Q,
              d = q.p != null;
            return (
              `<div class=card><div class=huge style="${q.t.length > 12 ? "font-size:26px;line-height:1.3" : ""}">${q.t}</div>` +
              q.o
                .map(
                  (x, i) =>
                    `<button class="b ${d ? (x == q.r ? "ok" : x == q.p ? "x" : "") : ""}" ${d || (q.bad || []).includes(x) ? "disabled" : ""} data-c="ans(${i})">${x}</button>`,
                )
                .join("") +
              (d ? "" : ajudaUI(q)) +
              (d
                ? `<h2>${q.p == q.r ? "✅ Isso mesmo!" : "Quase! Era " + q.r}</h2>Ganhou ${brl(q.g)}<button class="b g" data-c="go('job')">Continuar</button>`
                : "") +
              "</div>"
            );
          }
          return (
            reqCard() +
            JOBS.map((j, i) =>
              lv() < j.l
                ? i && lv() < JOBS[i - 1].l
                  ? ""
                  : `<div class=card>🔒 Próximo serviço: nível ${j.l}</div>`
                : `<button class=b ${j.b && cut(j.b) ? "disabled" : ""} data-c="start(${i})">${j.e} ${j.n}${j.b && cut(j.b) ? " 🔌" : ""}<small style="color:#08203a">${j.s ? j.s + " · " : ""}ganha ${brl(Math.round(j.v * (G.pc && !cut("luz") ? 1.3 : 1) * (G.bk ? 1.15 : 1) * (fraco() ? 0.5 : 1)))}</small></button>`,
            ).join("") +
            (lv() >= 2
              ? `<button class="b g" data-c="go('troca')">💸 Comprar e vender</button>`
              : "<div class=card>🔒 Comprar e vender: nível 2</div>")
          );
        },
        troca() {
          return (
            `<button class=s data-c="go('job')">⬅ Voltar</button>` +
            MERC.filter((m) => lv() >= m.l)
              .map((m) => {
                const p = G.pr[m.id],
                  h = G.inv[m.id] || { q: 0, c: 0 };
                return (
                  `<div class=card><div class=huge>${m.e}</div><b>${m.n}</b>: ${brl(p)}<div>${p < m.b * 0.85 ? "😍 Barato!" : p > m.b * 1.15 ? "🤑 Caro!" : "🙂 Normal"}</div>` +
                  (h.q
                    ? `<small>Pagou ${brl(h.c)} · lucro se vender: ${brl(p - h.c)}</small>`
                    : "") +
                  `<button class=b data-c="comp('${m.id}')" ${h.q || G.c < p ? "disabled" : ""}>Comprar</button><button class="b g" data-c="vend('${m.id}')" ${h.q ? "" : "disabled"}>Vender</button></div>`
                );
              })
              .join("")
          );
        },
        cofre() {
          return (
            `<div class=card><div class=huge>🏦</div><h2>${brl(G.b)}</h2><div>Amanhã rende +${brl(G.b * RATE)}</div><small>Em 10 dias: ${brl(G.b * Math.pow(1 + RATE, 10))}</small><canvas id=gr width=520 height=210 style="width:100%;margin-top:10px;border-radius:14px;background:#0004"></canvas></div><div class=two><button class=b data-c="mv('c','b',10)">Guardar 10</button><button class=b data-c="mv('c','b','t')">Guardar tudo</button><button class="b g" data-c="mv('b','c',10)">Sacar 10</button><button class="b g" data-c="mv('b','c','t')">Sacar tudo</button></div>` +
            emprCard()
          );
        },
        loja() {
          return (
            (N ? `<div class=card style="background:#7a2a5a">${N}</div>` : "") +
            LOJA.map((it, i) => {
              const own = it.k && G[it.k];
              return `<div class=card><div class=huge>${it.e}</div><b>${it.n}</b><small>${it.t}${it.k ? "" : " · 🎈 lazer +" + lzg(it)}</small><button class=b ${own || G.c + G.b < it.v ? "disabled" : ""} data-c="buy(${i})">${own ? "✔ Já tem" : brl(it.v)}</button></div>`;
            }).join("")
          );
        },
        proj() {
          return PROJ.map((p) =>
            lv() < p.l
              ? `<div class=card><div class=huge>🔒</div>Nível ${p.l}: ${p.e} ${p.n}<small>Rende ~${brl(p.r)} por dia · faltam ${NIV[p.l - 1] - G.xp} XP</small></div>`
              : `<div class=card><div class=huge>${p.e}</div><b>${p.n}</b><small>Rende ~${brl(p.r)} por dia · se paga em ${Math.ceil(p.c / p.r)} dias${G.c + G.b < p.c ? " · faltam " + brl(p.c - G.c - G.b) : ""}</small>` +
                (G.proj[p.id]
                  ? "<h2>✅ No ar!</h2>"
                  : `<button class="b g" ${G.c + G.b < p.c ? "disabled" : ""} data-c="proj('${p.id}')">Criar ${brl(p.c)}</button>`) +
                "</div>",
          ).join("");
        },
      };
      /* ==================================================================
   PARTE 6 — DESENHO NA TELA (render e canvas)
   ================================================================== */

      /* 🖼️ CANVAS = uma "folha de papel" digital dentro da página (<canvas> no HTML).
   Com JavaScript pegamos o "pincel" (getContext) e mandamos desenhar.
   Passos: 1) achar o canvas  2) pegar o pincel  3) escolher cor e espessura
           4) beginPath() começa um traço  5) moveTo/lineTo traçam  6) stroke() desenha.
   Este gráfico compara o cofre COM juros (linha dourada) e o dinheiro parado (tracejada). */
      function desenhaGrafico() {
        const cv = $("gr"); // 1) o elemento <canvas> criado na tela do Cofre
        if (!cv) return;
        const c = cv.getContext("2d"); // 2) o pincel 2D
        const W = cv.width,
          H = cv.height,
          M = 34; // largura, altura e margem
        c.clearRect(0, 0, W, H); // limpa o desenho anterior
        c.font = "18px system-ui,sans-serif";
        c.textAlign = "center";
        if (G.b <= 0) {
          c.fillStyle = "#c9c4ff";
          c.fillText("Guarde dinheiro para ver o gráfico crescer 📈", W / 2, H / 2);
          return;
        }
        const ini = G.b,
          fim = G.b * Math.pow(1 + RATE, 10); // hoje e daqui a 10 dias
        const x = (d) => M + (d * (W - 2 * M)) / 10; // converte DIA em posição horizontal
        const y = (v) => H - M - ((v - ini) / (fim - ini)) * (H - 2 * M); // converte VALOR em posição vertical
        // Linha tracejada: dinheiro parado, sem juros
        c.strokeStyle = "#c9c4ff";
        c.lineWidth = 2;
        c.setLineDash([6, 6]);
        c.beginPath();
        c.moveTo(x(0), y(ini));
        c.lineTo(x(10), y(ini));
        c.stroke();
        c.setLineDash([]);
        // Linha dourada: cada dia o cofre rende 3% sobre o valor do dia anterior (juros compostos)
        c.strokeStyle = "#ffd23f";
        c.lineWidth = 4;
        c.beginPath();
        for (let d = 0; d <= 10; d++) {
          const v = ini * Math.pow(1 + RATE, d);
          if (d == 0) c.moveTo(x(d), y(v));
          else c.lineTo(x(d), y(v));
        }
        c.stroke();
        // Bolinhas verdes, uma por dia (arc = círculo)
        c.fillStyle = "#2ee6b8";
        for (let d = 0; d <= 10; d++) {
          c.beginPath();
          c.arc(x(d), y(ini * Math.pow(1 + RATE, d)), 5, 0, Math.PI * 2);
          c.fill();
        }
        // Textos (fillText)
        c.fillStyle = "#fff";
        c.textAlign = "left";
        c.fillText("Hoje: " + brl(ini), M, H - 8);
        c.textAlign = "right";
        c.fillText("Dia 10: " + brl(fim), W - M, 22);
        c.fillStyle = "#c9c4ff";
        c.fillText("- - sem juros", W - M, H - 8);
      }

      /* 🎨 render() REDESENHA a tela inteira a partir de G. Sempre que algo muda, chamamos render(). */
      function render() {
        document.body.classList.toggle("calm", !!G.calm);
        const l = lv(),
          nx = NIV[l];
        $("top").innerHTML =
          `<div>👛<br><b>${brl(G.c)}</b></div><div>🏦<br><b>${brl(G.b)}</b></div><div data-c="pausa()">🕐 <b id=clk>${clk()}</b>${pz ? " ⏸" : ""}<br>Dia ${G.d} ${TIT[l - 1].split(" ")[0]}</div><div id=bar><i style="width:${nx ? ((G.xp - NIV[l - 1]) / (nx - NIV[l - 1])) * 100 : 100}%"></i></div>`;
        $("v").innerHTML = V[T]();
        if (T == "cofre") desenhaGrafico();
        $("av").innerHTML = avBar();
        const tab = T == "troca" ? "job" : T;
        $("n").innerHTML = [
          ["casa", "🏠", "Casa"],
          ["job", "💼", "Trabalho"],
          ["cofre", "🏦", "Cofre"],
          ["loja", "🛒", "Loja"],
          ["proj", "🚀", "Projetos"],
          ["faz", "🌱", "Fazenda"],
        ]
          .map(
            ([k, e, n]) =>
              `<button class="${k == tab ? "on" : ""}" data-c="go('${k}')"><span>${e}</span>${n}</button>`,
          )
          .join("");
        const m = $("m");
        if (M) {
          m.hidden = false;
          m.innerHTML =
            `<div class=card><div class=huge>${M.win ? "🏆" : "🔔"}</div><h2>${M.win ? "🎊 PARABÉNS! 🎊" : "Bom dia! Dia " + G.d}</h2>` +
            (M.length
              ? M.map(
                  (x) =>
                    `<div class=ln><span>${x[0]} ${x[1]}</span><b style="color:var(--gold)">${typeof x[2] == "number" ? (x[2] < 0 ? "−" : "+") + brl(Math.abs(x[2])) : x[2]}</b></div>`,
                ).join("")
              : "<div>Nada rendeu ainda. Guarde no cofre ou crie projetos!</div>") +
            `<button class="b g" data-c="fecha()">Beleza!</button></div>`;
        } else m.hidden = true;
      }
      function fecha() {
        M = null;
        render();
      }
      const F = {
        ajuda,
        pagaAt,
        tCalm,
        dif,
        resetar,
        adGo,
        adX,
        tAds,
        medico,
        emp,
        quita,
        vaca,
        leite,
        pedido,
        go,
        pay,
        dormir,
        start,
        ans,
        mv,
        buy,
        proj,
        comp,
        vend,
        fecha,
        come,
        plantar,
        colher,
        galinha,
        ovos,
        tSom,
        pausa,
      };
      /* ==================================================================
   PARTE 7 — EVENTOS (cliques) E RELÓGIO (setInterval)
   ================================================================== */
      /* 👆 Um único "ouvinte" de cliques: cada botão tem data-c="funcao(argumentos)". Aqui lemos esse texto e chamamos a função correspondente da lista F (só funções da lista F podem ser chamadas, por segurança). */
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-c]");
        if (!b || b.disabled) return;
        const m = b.dataset.c.match(/^(\w+)\((.*)\)$/);
        if (!m || !F[m[1]]) return;
        const a = m[2]
          ? m[2]
              .split(",")
              .map((x) => x.trim().replace(/^'|'$/g, ""))
              .map((x) => (x !== "" && !isNaN(x) ? +x : x))
          : [];
        sfx("pop");
        F[m[1]](...a);
      });
      render();
      let hh = Math.floor(G.h);
      /* ⏱️ RELÓGIO: a cada segundo o tempo do jogo anda. No modo calmo ele fica parado: o dia só passa quando você escolhe dormir. */
      setInterval(() => {
        if (M || pz || G.calm) return;
        G.h += 1 / 15;
        if (G.h >= 22) {
          dormir();
          return;
        }
        const e = $("clk");
        if (e) e.textContent = clk();
        const n = Math.floor(G.h);
        if (n != hh) {
          hh = n;
          save();
          const m = MEAL.find((x) => x.a == n);
          if (m) {
            sfx("bell");
            say(m.e + " Hora do " + m.n + "!");
          } else if (n == 20) {
            sfx("bell");
            say("😴 Já é tarde! Hora de ir dormir");
          } else if (n == 21) say("😴 Você dorme sozinho daqui a 1 hora");
          if (!G.rq && n >= 8 && n <= 19 && R() < 0.4) {
            const u = JOBS.map((j, i) => i).filter((i) => lv() >= JOBS[i].l);
            G.rq = { i: u[ri(0, u.length - 1)] };
            sfx("bell");
            say("📩 Chegou um pedido! Veja em Trabalho");
          }
          G.en = Math.max(0, G.en - 4);
          G.lz = Math.max(0, G.lz - 3);
          if (G.lz < 30 && n % 3 == 0) say("🎈 Está entediado! Divirta-se na Loja");
          if (G.div > 0 && n % 4 == 0) {
            sfx("bad");
            say("🏦 Banco: você deve " + brl(G.div) + "!");
          }
          if (
            G.ads &&
            !Q &&
            n >= 9 &&
            n <= 20 &&
            T != "loja" &&
            T != "proj" &&
            $("ad").hidden &&
            R() < 0.3
          )
            showAd();
          if (!(Q && Q.ph == 0)) render();
        }
      }, 1000);
    </script>
  </body>
